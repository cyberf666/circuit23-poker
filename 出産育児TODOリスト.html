<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>出産育児TODO</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--fg:#e8eaed;--mut:#9aa0aa;--acc:#6aa9ff;--ok:#34c759;--bd:#262b35;}
  @media (prefers-color-scheme: light){:root{--bg:#f5f6f8;--card:#fff;--fg:#1b1d22;--mut:#5b6066;--acc:#2563eb;--ok:#1a9e46;--bd:#e3e6ea;}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;padding:0 0 4rem}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}
  header.bar{position:sticky;top:0;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--bd);z-index:5}
  .barIn{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .prog{flex:1;height:8px;background:var(--bd);border-radius:99px;overflow:hidden}
  .prog>i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
  .pct{font-size:13px;color:var(--mut);min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
  button{font:inherit;color:#fff;background:var(--acc);border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
  button.ghost{background:transparent;color:var(--mut);border:1px solid var(--bd);padding:8px 12px;border-radius:8px}
  #gate{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px;max-width:380px;width:100%;text-align:center}
  .card h1{font-size:19px;margin:.2em 0 .1em} .card p{color:var(--mut);font-size:14px;margin:.2em 0 1.2em}
  input[type=password]{width:100%;padding:14px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:10px;margin-bottom:12px}
  #err{color:#ff6b6b;font-size:13px;min-height:1.2em;margin-top:10px}
  h1,h2,h3{line-height:1.4}
  h1{font-size:22px;margin:1.4em 0 .4em} h2{font-size:19px;margin:1.6em 0 .4em;padding-bottom:.3em;border-bottom:1px solid var(--bd)} h3{font-size:16px;color:var(--acc);margin:1.2em 0 .3em}
  hr{border:0;border-top:1px solid var(--bd);margin:1.4em 0}
  blockquote{margin:1em 0;padding:.6em 1em;background:var(--card);border-left:3px solid var(--acc);border-radius:8px;color:var(--mut);font-size:14px}
  blockquote p{margin:.3em 0}
  ul{list-style:none;padding:0;margin:.4em 0}
  li.plain{padding:.1em 0 .1em 1.2em;position:relative;color:var(--mut)}
  li.plain::before{content:"•";position:absolute;left:.2em;color:var(--acc)}
  li.ind{margin-left:1.7em}
  li.task{padding:0;margin:2px 0}
  li.task label{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
  li.task label:active{background:var(--card)}
  li.task input{appearance:none;-webkit-appearance:none;min-width:22px;height:22px;margin:1px 0 0;border:2px solid var(--mut);border-radius:6px;position:relative;cursor:pointer}
  li.task input:checked{background:var(--ok);border-color:var(--ok)}
  li.task input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  li.task input:checked + span{color:var(--mut);text-decoration:line-through}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:1em 0;border:1px solid var(--bd);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:380px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd)}
  th{background:var(--card)} tr:last-child td{border-bottom:0}
  code{background:var(--bd);padding:.1em .4em;border-radius:5px;font-size:.9em}
  strong{color:var(--fg)}
  .tools{display:flex;gap:10px;justify-content:flex-end;margin:1.5em 0}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <div style="font-size:34px">🔒</div>
    <h1>出産育児TODOリスト</h1>
    <p>パスワードを入力すると表示されます</p>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="パスワード" enterkeyhint="go">
    <button id="go" style="width:100%">ひらく</button>
    <div id="err"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="bar"><div class="barIn">
    <div class="prog"><i id="bar"></i></div>
    <div class="pct" id="pct">0 / 0</div>
    <button class="ghost" id="lock">ロック</button>
  </div></header>
  <div class="wrap"><div id="content"></div>
    <div class="tools"><button class="ghost" id="reset">チェックを全部リセット</button></div>
  </div>
</div>

const SKEY = 'ikuji-todo-checks';
const b2u = (b) => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b2u(DATA.s), iterations:200000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2u(DATA.i)}, key, b2u(DATA.c));
  return new TextDecoder().decode(pt);
}
function loadChecks(){ try{ return JSON.parse(localStorage.getItem(SKEY))||{} }catch(e){ return {} } }
function saveChecks(o){ localStorage.setItem(SKEY, JSON.stringify(o)); }
function updateProgress(){
  const all = document.querySelectorAll('#content input[type=checkbox]');
  const done = document.querySelectorAll('#content input[type=checkbox]:checked').length;
  document.getElementById('pct').textContent = done + ' / ' + all.length;
  document.getElementById('bar').style.width = all.length ? (done/all.length*100)+'%' : '0';
}
function mount(html){
  document.getElementById('content').innerHTML = html;
  const checks = loadChecks();
  document.querySelectorAll('#content input[type=checkbox]').forEach(cb => {
    if (checks[cb.id]) cb.checked = true;
    cb.addEventListener('change', () => {
      const c = loadChecks();
      if (cb.checked) c[cb.id] = 1; else delete c[cb.id];
      saveChecks(c); updateProgress();
    });
  });
  updateProgress();
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
}
async function tryOpen(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  if (!pw){ err.textContent='パスワードを入力してください'; return; }
  err.textContent='…';
  try { mount(await decrypt(pw)); sessionStorage.setItem('pw', pw); }
  catch(e){ err.textContent='パスワードが違います'; }
}
document.getElementById('go').addEventListener('click', tryOpen);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') tryOpen(); });
document.getElementById('lock').addEventListener('click', () => { sessionStorage.removeItem('pw'); location.reload(); });
document.getElementById('reset').addEventListener('click', () => {
  if(!confirm('この端末のチェック状態を全て消します。よろしいですか？')) return;
  localStorage.removeItem(SKEY);
  document.querySelectorAll('#content input[type=checkbox]').forEach(cb => cb.checked=false);
  updateProgress();
});
const sp = sessionStorage.getItem('pw');
if (sp) decrypt(sp).then(mount).catch(()=>{});
</script>
